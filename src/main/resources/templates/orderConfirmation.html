<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 정보 확인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img src="/BookMarket/imgs/book_icon.png">&nbsp;&nbsp;
            <span class="fs-4">BookMarket</span>
        </a>
    </header>

    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">주문 정보 확인</h1>
            <p class="col-md-8 fs-4">BookMarket</p>
        </div>
    </div>

    <!-- [추가] 재고가 부족해서 주문이 안 되면 오류 메시지를 보여준다 -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- 영수증: 지금까지 입력한 주문 내용을 보여준다 -->
    <div class="card col-md-8 mx-auto">
        <div class="card-body p-4">
            <div class="text-center mb-4"><h1>영수증</h1></div>

            <div class="row">
                <div class="col-sm-6">
                    <strong>배송 주소</strong>
                    <p>
                        성명: <span th:text="${order.shipping.name}"></span><br>
                        우편번호: <span th:text="${order.shipping.address.zipcode}"></span><br>
                        주소: <span th:text="${order.shipping.address.addressName}"></span>
                        <span th:text="${order.shipping.address.detailName}"></span>
                        (<span th:text="${order.shipping.address.country}"></span>)
                    </p>
                </div>
                <div class="col-sm-6 text-sm-end">
                    <p><em>배송일: <span th:text="${#temporals.format(order.shipping.date, 'yyyy/MM/dd')}"></span></em></p>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6">
                    <strong>청구 주소</strong>
                    <p>
                        성명: <span th:text="${order.customer.name}"></span><br>
                        전화번호: <span th:text="${order.customer.phone}"></span><br>
                        우편번호: <span th:text="${order.customer.address.zipcode}"></span><br>
                        주소: <span th:text="${order.customer.address.addressName}"></span>
                        <span th:text="${order.customer.address.detailName}"></span>
                        (<span th:text="${order.customer.address.country}"></span>)
                    </p>
                </div>
            </div>

            <table class="table table-hover">
                <thead>
                <tr>
                    <th>도서</th>
                    <th class="text-end">가격</th>
                    <th class="text-end">수량</th>
                    <th class="text-end">소계</th>
                </tr>
                </thead>
                <tbody>
                <!-- 도서 목록을 돌면서, 주문항목(orderItems)에서 같은 도서 ID의 수량·소계를 꺼낸다 -->
                <tr th:each="book : ${bookList}">
                    <td th:text="${book.bookId} + '-' + ${book.name}"></td>
                    <td class="text-end" th:text="${book.unitPrice.intValue()} + '원'"></td>
                    <td class="text-end" th:text="${order.orderItems.get(book.bookId).quantity} + '개'"></td>
                    <td class="text-end" th:text="${order.orderItems.get(book.bookId).totalPrice.intValue()} + '원'"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3" class="text-end">총액</th>
                    <th class="text-end" th:text="${order.grandTotal.intValue()} + '원'"></th>
                </tr>
                </tfoot>
            </table>

            <!-- [주문완료]를 누르면 POST /order/orderConfirmation → DB 저장 -->
            <form action="/BookMarket/order/orderConfirmation" method="post" class="text-center">
                <a href="/BookMarket/order/orderShippingInfo" class="btn btn-secondary">이전</a>
                <button type="submit" class="btn btn-success">주문완료</button>
                <a href="/BookMarket/order/orderCancelled" class="btn btn-secondary">취소</a>
            </form>
        </div>
    </div>

    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span class="text-body-secondary">&copy;2026 BookMarket</span>
    </footer>
</div>
</body>
</html>
