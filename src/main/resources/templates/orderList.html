<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <img src="/BookMarket/imgs/book_icon.png">&nbsp;&nbsp;
                <span class="fs-4">BookMarket</span>
            </a>
        </header>

        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">주문 목록</h1>
                <p class="col-md-8 fs-4">BookMarket</p>
            </div>
        </div>
        <div class="row align-items-md-stretch">

            <div class="text-end" style="padding-right: 30px">
                <form action="/BookMarket/logout" method="post">
                    <button type="submit" class="btn btn-sm btn-success">Logout</button>
                </form>
            </div>
            <div class="col-md-12">
                <form name="clearForm" method="post">
                    <input type="hidden" name="_method" value="delete">
                    <a th:href="@{/order/deleteAll}" class="btn btn-danger" style="float: left">삭제하기</a>
                </form>
            </div>
            <div style="padding-top: 50px">
                <div class="text-end" style="padding-right: 30px">
                    전체 주문수: [[${totalItems}]]
                </div>
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=orderId&sortDir=' + ${reverseSortDir}}">주문ID</a></th>
                        <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=custormer_id&sortDir=' + ${reverseSortDir}}">고객ID</a></th>
                        <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=shipping_id&sortDir=' + ${reverseSortDir}}">배송지</a></th>
                        <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=grandTotal&sortDir=' + ${reverseSortDir}}">총액</a></th>
                        <th>비고</th>
                    </tr>
                    </thead>
                    <tbody>
                    <form name="removeForm" id="removeForm" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <div th:each="order:${orderList}">
                            <tr>
                                <td th:text="${order.orderId}"></td>
                                <td th:text="${order.customer.id}"></td>
                                <td th:text="${order.shipping.address.addressName}"></td>
                                <td th:text="${order.grandTotal}"></td>
                                <!--    수정, 삭제 버튼 추가                                -->
                                <td></td>
                            </tr>
                        </div>
                        <tr>
                            <td></td>
                            <td></td>
                            <td class="text-right"><h5><b>총액: </b></h5></td>
                            <td class="text-cetner text-danger"><h4><b>[[${order.grandTotal}]]원</b></h4></td>
                        </tr>
                    </form>
                    </tbody>
                </table>
            </div>
            <div class="container col-md-5 py-3">
                <a href="/BookMarket/order/orderShippingInfo" class="btn btn-secondary" role="button">이전</a>
                <input type="submit" class="btn btn-seccess" value="주문완료"/>
                <a href="/BookMarket/order/orderCancelled" class="btn btn-secondary" role="button">취소</a>
            </div>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy;2026 BookMarket</span>
        </footer>
    </div>
</main>
</body>
</html>
