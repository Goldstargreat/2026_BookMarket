<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<main>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom">
            <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
                <img src="/BookMarket/imgs/book_icon.png">&nbsp;&nbsp;
                <span class="fs-4">BookMarket</span>
            </a>
        </header>

        <div class="p-5 mb-4 bg-body-tertiary rounded-3">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold">주문 목록</h1>
                <p class="col-md-8 fs-4">BookMarket</p>
            </div>
        </div>
        <div class="row align-items-md-stretch">

            <div class="text-end" style="padding-right: 30px">
                <!-- [수정] action → th:action : Spring Security 의 CSRF 토큰이 자동으로 들어가서 403 오류가 나지 않는다 -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-sm btn-success">Logout</button>
                </form>
            </div>

            <div class="col-md-12">
                <!-- [수정] clearForm : <a> 링크는 폼을 전송하지 못한다 (GET 요청만 보냄)
                            → th:action 을 폼에 넣고, 버튼을 submit 으로 바꿔서 폼이 실제로 전송되게 했다
                            → hidden _method=delete 덕분에 컨트롤러의 @DeleteMapping("/deleteAll") 이 받는다 -->
                <form name="clearForm" th:action="@{/order/deleteAll}" method="post"
                      onsubmit="return confirm('모든 주문을 삭제할까요?');">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit" class="btn btn-danger" style="float: left">삭제하기</button>
                </form>
            </div>

            <div style="padding-top: 50px">
                <div class="text-end" style="padding-right: 30px">
                    전체 주문수: [[${totalItems}]]
                </div>

                <!-- [수정] removeForm 을 <tbody> 안에서 <table> 바깥으로 옮김
                            (<tbody> 안에는 <tr> 만 올 수 있어서, 안에 <form> 을 두면 HTML 문법 오류) -->
                <form name="removeForm" id="removeForm" method="post">
                    <input type="hidden" name="_method" value="delete">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=orderId&sortDir=' + ${reverseSortDir}}">주문ID</a></th>
                            <!-- [수정] custormer_id(오타, DB 컬럼명) → customer.id (Order 클래스의 필드 경로) -->
                            <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=customer.id&sortDir=' + ${reverseSortDir}}">고객ID</a></th>
                            <!-- [수정] shipping_id(DB 컬럼명) → shipping.address.addressName (화면에 보이는 값과 같은 기준) -->
                            <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=shipping.address.addressName&sortDir=' + ${reverseSortDir}}">배송지</a></th>
                            <th><a th:href="@{'/order/page?pageNum=' + ${currentPage} + '&sortField=grandTotal&sortDir=' + ${reverseSortDir}}">총액</a></th>
                            <th>비고</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- [수정] <div th:each> 로 <tr> 을 감싸면 안 된다 (<tbody> 안에 <div> 불가)
                                    → th:each 를 <tr> 에 직접 붙임 -->
                        <tr th:each="order : ${orderList}">
                            <td th:text="${order.orderId}"></td>
                            <!-- [수정] ?. : customer, shipping, address 가 비어 있어도 오류가 나지 않게 함 -->
                            <td th:text="${order.customer?.id}"></td>
                            <td th:text="${order.shipping?.address?.addressName}"></td>
                            <td th:text="${order.grandTotal}"></td>
                            <!--    수정, 삭제 버튼 추가                                -->
                            <td></td>
                        </tr>

                        <tr>
                            <td></td>
                            <td></td>
                            <!-- [수정] text-right → text-end (Bootstrap 5 에서 이름이 바뀜) -->
                            <td class="text-end"><h5><b>총액: </b></h5></td>
                            <!-- [수정] text-cetner(오타) → text-center
                                        ${order.grandTotal} → 여기는 th:each 바깥이라 order 변수가 없어서 오류가 난다
                                        → 이 페이지 주문들의 grandTotal 을 모두 더한 값으로 바꿈 -->
                            <td class="text-center text-danger"><h4><b>[[${#aggregates.sum(orderList.![grandTotal])}]]원</b></h4></td>
                            <!-- [수정] 열이 5개라서 칸 하나 추가 -->
                            <td></td>
                        </tr>
                        </tbody>
                    </table>
                </form>

                <!-- [추가] 페이지 번호 : OrderProService 에서 한 페이지에 5건씩 나누므로
                            이 버튼이 없으면 6번째 주문부터는 화면에서 볼 수 없다
                            sortField, sortDir 를 같이 보내서 페이지를 넘겨도 정렬이 유지된다
                            (주문이 1건 이상 있을 때만 보임) -->
                <nav th:if="${totalPages > 0}">
                    <ul class="pagination justify-content-center">

                        <!-- 이전 : 1페이지에서는 누를 수 없게(disabled) -->
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{'/order/page?pageNum=' + ${currentPage - 1} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">이전</a>
                        </li>

                        <!-- 1 ~ totalPages 까지 번호 버튼, 지금 페이지는 강조(active) -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:href="@{'/order/page?pageNum=' + ${i} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}"
                               th:text="${i}">1</a>
                        </li>

                        <!-- 다음 : 마지막 페이지에서는 누를 수 없게(disabled) -->
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{'/order/page?pageNum=' + ${currentPage + 1} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">다음</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- [삭제] 이전 / 주문완료 / 취소 버튼 : 주문 확인 화면(orderConfirmation)에서 복사된 것으로
                        주문 목록 화면과 맞지 않고, 주문완료(submit) 버튼은 폼 바깥에 있어 눌러도 아무 동작을 하지 않았다
                        (btn-seccess 오타도 있었음) → 홈으로 가는 버튼으로 바꿈 -->
            <div class="container col-md-5 py-3">
                <a href="/BookMarket/home" class="btn btn-secondary" role="button">홈으로</a>
            </div>
        </div>

        <footer class="pt-3 mt-4 text-body-secondary border-top">
            <span class="text-body-secondary">&copy;2026 BookMarket</span>
        </footer>
    </div>
</main>
</body>
</html>
