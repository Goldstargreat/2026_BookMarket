<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 완료</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img src="/BookMarket/imgs/book_icon.png">&nbsp;&nbsp;
            <span class="fs-4">BookMarket</span>
        </a>
    </header>

    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">주문 완료</h1>
            <p class="col-md-8 fs-4">BookMarket</p>
        </div>
    </div>

    <div class="row align-items-md-stretch">
        <h2 class="alert alert-success">주문해 주셔서 감사합니다.</h2>
        <p>주문번호: <b th:text="${order.orderId}"></b></p>
        <p>배송일: <span th:text="${order.shipping.date}"></span></p>
        <p>총 결제금액: <span th:text="${order.grandTotal.intValue()} + '원'"></span></p>
        <p><a href="/BookMarket/books" class="btn btn-secondary">&laquo; 도서목록</a></p>
    </div>

    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span class="text-body-secondary">&copy;2026 BookMarket</span>
    </footer>
</div>
</body>
</html>
