<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container py-4">
    <header class="pb-3 mb-4 border-bottom">
        <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img src="/BookMarket/imgs/book_icon.png">&nbsp;&nbsp;
            <span class="fs-4">BookMarket</span>
        </a>
    </header>

    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">고객 정보</h1>
            <p class="col-md-8 fs-4">BookMarket</p>
        </div>
    </div>

    <div class="row align-items-md-stretch">
        <!-- th:object로 Customer 객체와 연결, *{필드명}으로 각 입력칸과 연결 -->
        <form action="/BookMarket/order/orderCustomerInfo" method="post" th:object="${customer}">
            <fieldset>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">고객 ID</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" th:field="*{customerId}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">성명</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" th:field="*{name}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">전화번호</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" th:field="*{phone}"/>
                    </div>
                </div>
                <!-- address.xxx : Customer 안의 Address 객체 필드 -->
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">국가명</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" th:field="*{address.country}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">우편번호</label>
                    <div class="col-sm-3">
                        <input type="text" class="form-control" th:field="*{address.zipcode}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">주소</label>
                    <div class="col-sm-5">
                        <input type="text" class="form-control" th:field="*{address.addressName}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <label class="col-sm-2 control-label">상세주소</label>
                    <div class="col-sm-5">
                        <input type="text" class="form-control" th:field="*{address.detailName}"/>
                    </div>
                </div>
                <div class="mb-3 row">
                    <div class="offset-sm-2 col-sm-10">
                        <input type="submit" class="btn btn-primary" value="다음"/>
                        <a href="/BookMarket/order/orderCancelled" class="btn btn-secondary">취소</a>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>

    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span class="text-body-secondary">&copy;2026 BookMarket</span>
    </footer>
</div>
</body>
</html>
