<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>
<div class="container py-4">

    <header class="pb-3 mb-4 border-bottom">
        <a href="/BookMarket/home" class="d-flex align-items-center text-body-emphasis text-decoration-none">
            <img src="/BookMarket/imgs/book_icon.png" alt="BookMarket 로고">
            <span class="fs-4">BookMarket</span>
        </a>
    </header>

    <div class="p-5 mb-4 bg-body-tertiary rounded-3">
        <div class="container-fluid py-5">
            <h1 class="display-5 fw-bold">로그인</h1>
            <p class="col-md-8 fs-4">BookMarket</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-3">
                <h3>로그인이 필요합니다.</h3>
            </div>

            <div class="alert alert-danger" th:if="${param.error}">
                UserName과 Password가 올바르지 않습니다.
            </div>

            <form action="/BookMarket/login" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control"
                           placeholder="Input UserName" required autofocus>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control"
                           placeholder="Input Password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-lg btn-success">로그인</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="pt-3 mt-4 text-body-secondary border-top">
        <span>@ BookMarket</span>
    </footer>

</div>
</body>
</html>
