Pattern.book.bookId = 유효하지 않은 도서ID입니다.('isbn'으로 시작하고 숫자를 조합하세요.)
Size.book.name = 유효하지 않은 도서명입니다.(최소 4 ~ 최대 50자까지 입력하세요.)
Min.book.unitPrice = 유효하지 않은 가격입니다.(0 이상의 숫자를 입력하세요.)
Digits.book.unitPrice = 유효하지 않은 가격입니다.(8자리까지 입력, 소수점 2자리까지)
NotNull.book.unitPrice = 유효하지 않은 가격입니다.(가격을 입력하세요.)

BookId.book.bookId = 해당 도서 ID가 이미 존재합니다.